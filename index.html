<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#800080">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="static/images/icon.svg">
  <link rel="stylesheet" href="static/css/style.css">
  <title>Document</title>
</head>
<body>
  <nav>
    <img src="static/images/user.svg" alt="User Icon" width="32" height="32">
    <span>Emanuel Costa</span>
  </nav>
  <main>
    <div class="topo">
      <h1>Treinos</h1>
      <p>Todos os treinos são full-body, com um/dois focos.</p>
    </div>

    <div class="treino-box">
      <div class="icon-treino">
        <img src="static/images/chest.png" alt="">
        <div>
          <h2>Treino A</h2>
          <p>Foco: Peito</p>
        </div>
      </div>
      <button>Iniciar</button>
    </div>

    <div class="treino-box">
      <div class="icon-treino">
        <img src="static/images/back.png" alt="">
        <div>
          <h2>Treino B</h2>
          <p>Foco: Costas</p>
        </div>
      </div>
      <button>Iniciar</button>
    </div>

    <div class="treino-box">
      <div class="icon-treino">
        <img src="static/images/leg.png" alt="">
        <div>
          <h2>Treino C</h2>
          <p>Foco: Pernas</p>
        </div>
      </div>
      <button>Iniciar</button>
    </div>

    <div class="treino-box">
      <div class="icon-treino">
        <img src="static/images/shoulder.png" alt="">
        <div>
          <h2>Treino D</h2>
          <p>Foco: Peito e Ombros</p>
        </div>
      </div>
      <button>Iniciar</button>
    </div>

    <div class="treino-box">
      <div class="icon-treino">
        <img src="static/images/biceps.png" alt="">
        <div>
          <h2>Treino E</h2>
          <p>Foco: Costas e Braços</p>
        </div>
      </div>
      <button><p>Iniciar</p></button>
    </div>

  </main>

  <script src="static/js/app.js"></script>
</body> 
</html>
